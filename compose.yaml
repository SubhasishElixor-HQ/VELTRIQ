services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehiclegpt}
      POSTGRES_USER: ${POSTGRES_USER:-vehiclegpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vehiclegpt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vehiclegpt} -d ${POSTGRES_DB:-vehiclegpt}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vehiclegpt_postgres:
